name: Upload

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check script syntax
        run: |
          set -euo pipefail
          for f in src/*.js src/spells/*.js scripts/*.mjs tools/*.mjs; do
            node --check --input-type=module < "$f"
          done
      - name: Select frontend CDN path
        id: asset-path
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          asset_prefix="${GITHUB_REPOSITORY}/"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          fi
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=https://cos-sh.tiye.me/${asset_prefix}" >> "$GITHUB_OUTPUT"
      - name: Build page
        env:
          AUDIO_BASE: ${{ github.event_name == 'pull_request' && 'audio/' || format('{0}audio/', steps.asset-path.outputs.base-url) }}
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node -e "const h=require('fs').readFileSync('dist/index.html','utf8');const a=h.indexOf('<script>\n')+9,b=h.lastIndexOf('</script>');require('fs').writeFileSync('/tmp/page.js',h.slice(a,b))"
          node --check /tmp/page.js
      - name: Preserve PR page for isolated acceptance
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 3
          if-no-files-found: error
      - name: Check current production revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skip stale production revision ${GITHUB_SHA}; current main is ${current_sha}."
          fi
      - name: Upload and verify page
        if: steps.production.outputs.current == 'true'
        timeout-minutes: 10
        uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
      - name: Deploy to server
        id: deploy
        if: steps.production.outputs.current == 'true'
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: '-avzr --progress'
          options: '--exclude=audio/'
          ssh_options: ''
          src: 'dist/*'
          dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'
      - name: Display server deployment status
        if: steps.production.outputs.current == 'true'
        run: echo "${{ steps.deploy.outputs.status }}"
